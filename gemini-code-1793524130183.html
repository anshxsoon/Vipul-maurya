<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vipul Maurya | Video Editor & Content Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg: #0a0a0a;
        --ink: #f2eee6;
        --mut: #8d8a83;
        --gold: #00e5ff;
        --line: rgba(242, 238, 230, 0.1);
        --serif: "Playfair Display", Georgia, serif;
        --sans: "Inter", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-weight: 300;
        line-height: 1.6;
        overflow-x: hidden;
      }
      a { color: inherit; text-decoration: none; }
      
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 5%;
      }
      
      /* --- HERO SECTION --- */
      #home {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 50px;
      }
      .hero-title {
        font: 700 clamp(3.5rem, 10vw, 8rem) var(--serif);
        line-height: 0.9;
        margin-bottom: 20px;
        background: linear-gradient(180deg, #ffffff 10%, #a0c4ff 100%);
        -webkit-background-clip: text;
        color: transparent;
      }
      .hero-sub {
        color: var(--gold);
        font-size: 1.2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 30px;
      }
      .lead {
        color: var(--mut);
        font-size: 1.1rem;
        max-width: 600px;
        margin-bottom: 40px;
      }
      
      /* --- BUTTONS --- */
      .cta-group { display: flex; gap: 15px; flex-wrap: wrap; }
      .cta {
        padding: 12px 28px;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 50px;
        font-weight: 500;
        transition: 0.3s;
      }
      .cta-primary {
        background: var(--gold);
        color: #0a0a0a;
      }
      .cta-primary:hover { background: #fff; }
      .cta-outline {
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .cta-outline:hover { border-color: var(--gold); color: var(--gold); }

      /* --- CONTACT SECTION --- */
      #contact {
        padding: 100px 0;
        border-top: 1px solid var(--line);
        margin-top: 100px;
      }
      .contact-info {
        font-size: 1.5rem;
        font-family: var(--serif);
        color: var(--gold);
        margin-top: 20px;
      }
    </style>
  </head>
  <body>

    <main>
      <section id="home">
        <div class="wrap">
          <p class="hero-sub">Video Editor & Creator</p>
          <h1 class="hero-title">Vipul<br>Maurya</h1>
          <p class="lead">
            I craft smooth, high-retention video edits that turn raw footage into aesthetic, engaging visual stories.
          </p>
          <div class="cta-group">
            <a href="https://drive.google.com/drive/folders/18lbwIJL9wXTLW4LxHgrrFDPlLKdGdla4?usp=drive_link" target="_blank" class="cta cta-primary">Watch My Edits ↗</a>
            <a href="https://www.instagram.com/ig_x_mickkey?obrf=ZDNlZDc0MzIxNw==" target="_blank" class="cta cta-outline">Instagram ↗</a>
          </div>
        </div>
      </section>

      <section id="contact">
        <div class="wrap">
          <h2>Let's create together.</h2>
          <p class="lead" style="margin-top: 20px;">Ready to elevate your content? Hit me up directly.</p>
          <div class="contact-info">
            Phone / WhatsApp: 92773 85343
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
